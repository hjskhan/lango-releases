# The private Lango repo's build pushes a tag here with lango.apk and NOTES.md; this publishes it as a release,
# which the app's update check reads (releases/latest).
name: Publish release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" lango.apk --title "Lango ${GITHUB_REF_NAME#v}" --notes-file NOTES.md
